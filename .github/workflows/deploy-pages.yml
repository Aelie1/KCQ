name: Deploy WebUI to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Check out latest release tag
        shell: bash
        run: |
          release_tag="$(git describe --tags --abbrev=0)"
          echo "Deploying $release_tag"
          git checkout --detach "$release_tag"
          echo "KCQ_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WebUI
        run: npm run web:build
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web/

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4