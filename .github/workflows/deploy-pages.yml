name: Deploy WebUI to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: master
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect release tag
        shell: bash
        run: |
          if release_tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "KCQ_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          fi

      - name: Build WebUI
        run: npm run web:build
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web/

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
